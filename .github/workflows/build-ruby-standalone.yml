name: Build Ruby Standalone

on:
  workflow_dispatch:
    inputs:
      ruby_version:
        description: 'Ruby version to build'
        required: false
        default: '3.2.3'
      openssl_version:
        description: 'OpenSSL version to compile'
        required: false
        default: '3.2.3'
      libyaml_version:
        description: 'libyaml version to compile'
        required: false
        default: '0.2.5'
  release:
    types: [published]

env:
  RUBY_VERSION: ${{ github.event.inputs.ruby_version || '3.2.3' }}
  OPENSSL_VERSION: ${{ github.event.inputs.openssl_version || '3.2.3' }}
  LIBYAML_VERSION: ${{ github.event.inputs.libyaml_version || '0.2.5' }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x86_64
            runner: macos-26-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create workspace
        run: mkdir -p workspace

      - name: Install build tools
        run: |
          brew install autoconf automake libtool pkg-config

      - name: Compile OpenSSL from source
        run: bash scripts/build-openssl.sh ${{ matrix.arch }}

      - name: Compile libyaml from source
        run: bash scripts/build-libyaml.sh ${{ matrix.arch }}

      - name: Download, configure, and build Ruby
        run: bash scripts/build-ruby.sh ${{ matrix.arch }}

      - name: Update RubyGems and install gems
        run: bash scripts/install-gems.sh ${{ matrix.arch }}

      - name: Copy dylibs and fix paths
        run: bash scripts/fix-dylibs.sh ${{ matrix.arch }}

      - name: Verify and package
        run: bash scripts/package.sh ${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ruby_${{ env.RUBY_VERSION }}_${{ matrix.arch }}
          path: ruby_${{ env.RUBY_VERSION }}_${{ matrix.arch }}.tar.gz
          retention-days: 30

  release:
    needs: build
    if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.tar.gz
          tag_name: ${{ github.event.release.tag_name || format('ruby-{0}', github.event.inputs.ruby_version || '3.2.3') }}
          generate_release_notes: true
          draft: true
